    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8766e"/><stop offset="1" stop-color="#7f5450"/></linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e9dcc3"/><stop offset="1" stop-color="#b9a283"/></linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d79aa3"/><stop offset="1" stop-color="#b9707c"/></linearGradient>
    <radialGradient id="bell" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#fff2c6"/><stop offset="0.6" stop-color="#e2b964"/><stop offset="1" stop-color="#b98a3a"/></radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.35" r="0.7"><stop offset="0" stop-color="#9a6a8a"/><stop offset="1" stop-color="#5a3550"/></radialGradient>
  </defs>
  <!-- back hair -->
