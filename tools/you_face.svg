    <path d="M268 244 C282 226 314 228 326 246" fill="none" stroke="#4a2f3c" stroke-width="5" stroke-linecap="round"/>
    <path d="M196 222 C206 214 224 214 234 220" fill="none" stroke="#9b8378" stroke-width="3.5" stroke-linecap="round"/>
