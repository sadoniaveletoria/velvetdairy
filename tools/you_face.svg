  <path d="M282 130 C302 126 320 138 322 154 C306 160 288 154 282 130 Z" fill="#f7efe6" opacity="0.95"/><path d="M196 140 C206 132 220 134 222 144 C212 150 200 148 196 140 Z" fill="#f7efe6" opacity="0.95"/>
  <path d="M168 230 C160 280 162 320 172 350 C176 320 178 280 180 240 Z" fill="url(#hair)"/>
  <path d="M344 230 C352 280 350 320 340 350 C336 320 334 280 332 240 Z" fill="url(#hair)"/>
