  <!-- face -->
  <path d="M168 220 C166 300 206 352 256 356 C306 352 346 300 344 220 C344 170 306 140 256 140 C206 140 168 170 168 220 Z" fill="url(#skin)" stroke="#c99a8a" stroke-width="2.5"/>
