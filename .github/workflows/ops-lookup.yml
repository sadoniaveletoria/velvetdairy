name: Ops lookup (temporary, read-only)
on:
  push:
    branches: [ ops-lookup ]
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only check of her installs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          mkdir w && cd w && printf 'name="x"\n' > wrangler.toml
          npx --yes wrangler@4 d1 execute velvet-dairy --remote --json --command "SELECT substr(id,1,8) AS inst, last_seen, version, (SELECT COUNT(*) FROM memberships m WHERE m.install=i.id) AS mships, (SELECT name FROM dairies d WHERE d.owner=i.id) AS owns FROM installs i WHERE char_hash='8f93b8aa3ac5f56d16fba688cb9aaaf8f240341c275042af1cabefc013c3039b' OR substr(id,1,8) IN ('c7eda918','5340a356')" | grep '"inst"\|last_seen\|version\|mships\|owns'
          date -u +%s
