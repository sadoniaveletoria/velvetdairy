name: Ops lookup (temporary, read-only)
on:
  push:
    branches: [ ops-lookup ]
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only check of her installs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          mkdir w && cd w && printf 'name="x"\n' > wrangler.toml
          npx --yes wrangler@4 d1 execute velvet-dairy --remote --json --command "SELECT id, last_seen, version, (SELECT COUNT(*) FROM memberships m WHERE m.install=i.id) AS mships FROM installs i WHERE key_hash='14455c1c35381ebd348995d27ab2ec8268c8c75d42a93f4ae6b9e14bf0e17039'" | grep '"id"\|last_seen\|version\|mships'
