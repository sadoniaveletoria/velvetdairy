name: Ops lookup (temporary, read-only)
on:
  push:
    branches: [ ops-lookup ]
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          mkdir w && cd w && printf 'name="x"\n' > wrangler.toml
          echo "== feeding bells, last 24 h =="
          npx --yes wrangler@4 d1 execute velvet-dairy --remote --json --command "SELECT d.name AS dairy, n.name AS rung_as, substr(n.install,1,8) AS inst, datetime(n.created,'unixepoch') AS at_utc, i.version, datetime(i.last_seen,'unixepoch') AS inst_last_seen, (SELECT group_concat(DISTINCT m.name) FROM memberships m WHERE m.install=n.install) AS names_on_install, (SELECT COUNT(*) FROM installs i2 WHERE i2.char_hash=i.char_hash) AS installs_same_char FROM dairy_notice n JOIN dairies d ON d.id=n.dairy_id LEFT JOIN installs i ON i.id=n.install WHERE n.kind='feedingBell' ORDER BY n.created DESC" | grep -v '"served\|"timings\|sql_duration\|"duration\|size_after\|total_attempts\|last_row_id\|rows_read\|rows_written\|changed_db\|"changes\|"success\|"meta'
          echo "== installs with Elitross =="
          npx --yes wrangler@4 d1 execute velvet-dairy --remote --json --command "SELECT substr(m.install,1,8) AS inst, m.name, d.name AS dairy, m.role, datetime(i.last_seen,'unixepoch') AS last_seen, i.version, json_extract(m.status,'$.w') AS status_w FROM memberships m JOIN dairies d ON d.id=m.dairy_id JOIN installs i ON i.id=m.install WHERE m.name LIKE 'Elitross%'" | grep -v '"served\|"timings\|sql_duration\|"duration\|size_after\|total_attempts\|last_row_id\|rows_read\|rows_written\|changed_db\|"changes\|"success\|"meta'
          date -u
