name: Ops lookup (temporary, read-only)
on:
  push:
    branches: [ ops-lookup ]
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Point her old install at her current key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          mkdir w && cd w && printf 'name="x"\n' > wrangler.toml
          OLD="(SELECT owner FROM dairies WHERE name='Velvet Dairy' AND substr(owner,1,8)='c7eda918')"
          npx --yes wrangler@4 d1 execute velvet-dairy --remote --json --command "UPDATE installs SET key_hash='8887b6212aeb071d798661126c93373c037adf22a74d41406cfddaa25a4a312b' WHERE id=$OLD AND substr(id,1,8)='c7eda918'" | grep '"changes"'
          npx --yes wrangler@4 d1 execute velvet-dairy --remote --json --command "SELECT id, key_hash='8887b6212aeb071d798661126c93373c037adf22a74d41406cfddaa25a4a312b' AS key_ok FROM installs WHERE id=$OLD" | grep '"id"\|key_ok'
