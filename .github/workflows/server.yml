name: Network server

# Tests the Velvet Dairy Network worker, then deploys it to Cloudflare when server/ changes on main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers + D1 edit) and CLOUDFLARE_ACCOUNT_ID.
# Without them it only runs the tests. After deploying it writes the server's address into network.json,
# which is how the plugin finds the server (so the server can move without a plugin update).
on:
  push:
    branches: [ main ]
    paths: [ 'server/**', '.github/workflows/server.yml' ]
  pull_request:
    paths: [ 'server/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: node --no-warnings server/test/run.mjs

      - name: Check for Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set (or this is a pull request): tests only, no deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the database if needed and apply the schema
        if: steps.cf.outputs.deploy == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          find_id() { npx --yes wrangler@4 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="velvet-dairy");process.stdout.write(d?(d.uuid||d.id||""):"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 d1 create velvet-dairy
            ID=$(find_id)
          fi
          echo "Database: $ID"
          sed -i "s/database_id = \".*\"/database_id = \"$ID\"/" wrangler.toml
          npx --yes wrangler@4 d1 execute velvet-dairy --remote --file=schema.sql --yes

      - name: Deploy
        if: steps.cf.outputs.deploy == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx --yes wrangler@4 deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Couldn't find the worker address in the deploy output."; exit 1; fi
          echo "Server: $URL"
          printf '{\n  "api": "%s"\n}\n' "$URL" > ../network.json

      - name: Publish the server address
        if: steps.cf.outputs.deploy == 'true'
        run: |
          if git diff --quiet -- network.json 2>/dev/null && git ls-files --error-unmatch network.json >/dev/null 2>&1; then
            echo "Address unchanged."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add network.json
          git commit -m "Update network server address"
          git push
